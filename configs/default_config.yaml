# ==============================================================================
# RadarCamCalib 默认配置文件 / Default Configuration
# 所有参数均可在此修改，程序启动时读取
# ==============================================================================

# --- 数据集路径 (Dataset paths) ---
dataset:
  root: ""                    # 数据集根目录，运行时由 UI 选择
  sync_folder: "sync"         # sync JSON 文件夹名 (相对于 root)

# --- 传感器 ID (Sensor IDs) ---
# 用于从 sync JSON 中区分 camera 和 radar 数据
sensors:
  default_camera_sensor_id: 1   # 相机传感器 ID (sync JSON 中的 sensor_id)
  default_radar_sensor_id: 2    # 雷达传感器 ID

# --- 目标类别 (Object classes) ---
# radar JSON 中的 class 字段会自动映射为英文 (见 data/radar_loader.py CLASS_MAP)
classes:
  default_class: "vehicle"      # 缺省类别
  valid_classes:                # 有效类别列表 (用于过滤)
    - vehicle
    - car
    - truck
    - bus
    - cyclist
    - pedestrian
    - unknown

# --- 标定参数 (Calibration parameters) ---
calibration:
  ransac_threshold: 5.0         # RANSAC 重投影阈值 (像素)，越小越严格
  min_matched_points: 4         # 计算 Homography 所需最少点对数

# --- BEV 显示参数 (Bird's Eye View display) ---
# 控制 BEV 视口的坐标范围和分辨率
bev:
  x_range: [-100, 100]          # 横向范围 (米)，正值=右侧
  y_range: [0, 300]             # 纵向范围 (米)，正值=前方
  resolution: 1.0               # 栅格分辨率 (米/格)

# --- 轨迹参数 (Trajectory parameters) ---
trajectory:
  min_track_len: 5              # 最短轨迹长度 (帧数)，低于此值的轨迹被过滤

# --- 感知范围估计参数 (Range estimation parameters) ---
# 用于从多帧轨迹数据中估算雷达有效感知范围
range_estimation:
  x_range: [-100, 100]          # 分析区域横向范围 (米)
  y_range: [0, 300]             # 分析区域纵向范围 (米)
  resolution: 1.0               # 栅格分辨率 (米/格)
  min_count: 3                  # 栅格内最少检测次数才算"有效"
  dbscan_eps: 3.0               # DBSCAN 聚类邻域半径 (米)
  dbscan_min_samples: 10        # DBSCAN 最少样本数
  min_area_m2: 20.0             # 最小多边形面积 (平方米)，过滤碎片

# --- UI 显示选项 (UI display options) ---
ui:
  show_track_id: true           # 是否显示目标 track ID 标签
  show_projected_points: true   # 是否显示雷达投影点 (绿色圆圈)
  show_trajectories: false      # 启动时是否默认显示轨迹
  show_range_polygon: true      # 是否显示感知范围多边形
